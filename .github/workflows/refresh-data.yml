name: Refresh public Broncos data
on:
  workflow_dispatch:
  schedule:
    # Four daily checks in UTC. This polls for feed updates, not an instant game-final trigger.
    - cron: '17 1,7,13,19 * * *'
permissions:
  contents: write
concurrency:
  group: broncos-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Update data (skip corrupt or incomplete source reductions)
        run: python data_pipeline.py --seasons 2024 2025 2026
        env:
          NFLREADPY_CACHE: 'off'
      - name: Validate snapshot
        run: python -m pytest -q
      - name: Commit updated public datasets (if changed)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/broncos_plays.csv data/import_status.json
          if [ -f data/bo_nix_ngs_weekly.csv ]; then git add data/bo_nix_ngs_weekly.csv; fi
          if git diff --cached --quiet; then
            echo 'No new published game data to commit.'
          else
            git commit -m 'Refresh published Broncos data'
            git push
          fi
