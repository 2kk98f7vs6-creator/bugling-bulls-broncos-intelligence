name: Validate Broncos Intelligence
on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m compileall -q app.py analysis_engine.py data_pipeline.py
          python -m pytest -q
